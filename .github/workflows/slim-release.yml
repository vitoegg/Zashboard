name: Build Slim Release

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Upstream commit SHA (40 chars); empty = latest upstream release'
        required: false
        type: string

permissions: {}

concurrency:
  group: slim-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: Zephyruso/zashboard

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          if [ -z "$INPUT_COMMIT" ]; then
            ref=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          elif [[ "$INPUT_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            ref=$INPUT_COMMIT
          else
            echo "::error::upstream_commit must be a full 40-char SHA"; exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          path: self
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream
          persist-credentials: false

      - name: Read upstream metadata
        id: meta
        working-directory: upstream
        env:
          REF: ${{ steps.ref.outputs.ref }}
          INPUT_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          tag="v$(jq -r .version package.json)"
          if [ -z "$INPUT_COMMIT" ] && [ "$tag" != "$REF" ]; then
            echo "::error::version mismatch: package.json=$tag release=$REF"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Build dist.zip
        working-directory: upstream
        env:
          HUSKY: '0'
          UPDATE_REPO: ${{ github.repository }}
        run: |
          pnpm install --frozen-lockfile
          sh ../self/maint/apply.sh .
          pnpm type-check
          pnpm exec vite build --config slim/vite.config.ts
          test -s dist/index.html
          zip -qr9 ../dist.zip dist
          size=$(stat -c %s ../dist.zip)
          echo "dist.zip: $size bytes"
          test "$size" -lt 1048576

      - uses: actions/upload-artifact@v7
        with:
          path: dist.zip
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist.zip
          skip-decompress: true

      - name: Publish release
        run: |
          cat > notes.md <<EOF
          🪶 Slim build of $UPSTREAM_REPO

          - 🔖 Version: \`$TAG\`
          - 🔗 Upstream: [\`${UPSTREAM_SHA::7}\`](https://github.com/$UPSTREAM_REPO/commit/$UPSTREAM_SHA)
          - 🛠️ Build: [\`${GITHUB_SHA::7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA)
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Move the existing tag first so a rejection leaves the release untouched.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release upload "$TAG" dist.zip --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist.zip --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md --latest
          fi

      - name: Delete other releases
        run: |
          gh release list --limit 100 --json tagName \
            --jq ".[].tagName | select(. != \"$TAG\")" |
            xargs -r -n1 gh release delete --cleanup-tag --yes

      - name: Delete previous workflow runs
        run: |
          gh run list --status completed --limit 100 --json databaseId \
            --jq '.[].databaseId' |
            xargs -r -n1 gh run delete
